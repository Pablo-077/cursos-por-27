<title>PMX - A New Standard</title>


<style>


*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}



:root{

    --gold:#d4af37;
    --black:#000;
    --panel:#080808;

}



html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    touch-action:manipulation;

}



body{

    background:#000;

    color:white;

    font-family:Arial, Helvetica, sans-serif;

}






/* =====================
        LOADING
===================== */


.loader{

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#000;

}



.logo-load{

    color:var(--gold);

    font-size:85px;

    font-weight:900;

    letter-spacing:15px;

    animation:logoIn 1.8s ease;

    text-shadow:

    0 0 30px rgba(212,175,55,.6);

}





.tagline{

    margin-top:15px;

    letter-spacing:7px;

    color:#ddd;

    opacity:0;

    animation:tagIn 1.5s forwards;

    animation-delay:.5s;

}





@keyframes logoIn{


from{

opacity:0;

transform:scale(.7);

}


to{

opacity:1;

transform:scale(1);

}


}





@keyframes tagIn{


to{

opacity:1;

}


}










/* =====================
        HOME
===================== */


.home{

    display:none;

    height:100vh;

}










/* =====================
       TOPO PMX
===================== */


.brand-bar{


height:145px;


width:100%;



background:


radial-gradient(

circle at center,

rgba(212,175,55,.18),

transparent 55%

),



linear-gradient(

180deg,

#090909,

#020202

);



display:flex;


flex-direction:column;


justify-content:center;


align-items:center;


position:relative;


overflow:hidden;



}






/* brilho passando */


.brand-bar::after{


content:"";


position:absolute;


top:0;


left:-100%;


width:60%;


height:100%;



background:


linear-gradient(

90deg,

transparent,

rgba(212,175,55,.3),

transparent

);



animation:shine 5s infinite;



}





@keyframes shine{


0%{

left:-100%;

}


50%{

left:130%;

}


100%{

left:130%;

}


}







.logo{


color:var(--gold);


font-size:52px;


font-weight:900;


letter-spacing:22px;



text-shadow:


0 0 25px rgba(212,175,55,.5);



}







.brand-subtitle{


margin-top:12px;


font-size:12px;


letter-spacing:9px;


color:#ddd;



}






.brand-separator{


position:absolute;


bottom:-1px;


width:70%;


height:2px;



background:


linear-gradient(

90deg,

transparent,

var(--gold),

transparent

);



box-shadow:


0 0 15px rgba(212,175,55,.8);



}






.separator-star{


position:absolute;


bottom:-9px;


background:#050505;


color:var(--gold);


padding:0 15px;


font-size:15px;



}
/* =====================
       BARRINHA PMX
===================== */


.navigation{


    width:100%;


    height:80px;



    display:flex;


    justify-content:space-between;


    align-items:center;



    padding:0 28px;



}






.icon-btn{


    width:48px;


    height:48px;



    display:flex;


    align-items:center;


    justify-content:center;



    cursor:pointer;



    position:relative;



    z-index:5;



    transition:.3s;



}






.icon-btn svg{


    width:34px;


    height:34px;



    display:block;



    stroke:#d4af37;



    fill:none;



    stroke-width:2;



    stroke-linecap:round;



    stroke-linejoin:round;



}






.icon-btn:active{


    transform:translateY(-4px) scale(.95);



}









/* =====================
       PAINÃÂIS
===================== */


.panel{


    position:fixed;



    top:0;



    width:300px;



    height:100vh;



    background:#080808;



    z-index:20;



    padding:35px 25px;



    transition:.4s ease;



    box-shadow:

    0 0 40px rgba(0,0,0,.8);



}






.menu-panel{


    left:-320px;



}






.menu-panel.active{


    left:0;



}








.cart-panel{


    right:-320px;



}






.cart-panel.active{


    right:0;



}








.panel h2{


    color:var(--gold);



    text-align:center;



    letter-spacing:5px;



    margin-bottom:25px;



}








.panel-line{


    width:100%;


    height:1px;



    background:


    linear-gradient(

    90deg,

    transparent,

    var(--gold),

    transparent

    );



    margin-bottom:30px;



}








/* =====================
       MENU LATERAL - NOVA MECÃÂNICA
===================== */

/* =====================
       MENU LATERAL - VISUAL PMX
===================== */

.menu-panel{
    top:225px;
    left:0;
    width:min(54vw,250px);
    height:calc(100vh - 225px);
    padding:28px 18px 24px;
    overflow-y:auto;
    overflow-x:hidden;
    border-radius:0 18px 18px 0;
    border:1px solid rgba(255,255,255,.16);
    border-left:0;
    background:
        linear-gradient(135deg,rgba(18,18,18,.98),rgba(5,5,5,.985) 55%,rgba(12,12,12,.98));
    box-shadow:
        10px 0 35px rgba(0,0,0,.55),
        inset -1px 0 0 rgba(255,255,255,.05);
    transform:translateX(-110%);
    transition:transform .4s cubic-bezier(.22,.8,.25,1);
}

.menu-panel.active{
    left:0;
    transform:translateX(0);
}

.menu-panel h2{
    font-size:22px;
    font-weight:700;
    letter-spacing:7px;
    margin:0 0 18px;
    padding-left:7px;
    text-align:center;
    color:var(--gold);
    text-shadow:0 0 12px rgba(212,175,55,.18);
}

.menu-panel .panel-line{
    height:1px;
    margin:0 0 12px;
    background:linear-gradient(90deg,transparent,rgba(212,175,55,.20),transparent);
}

.menu-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:20px;
    width:100%;
    min-height:66px;
    padding:0 10px;
    margin:0;
    color:#f4f4f4;
    border-radius:0;
    border-bottom:1px solid rgba(255,255,255,.055);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:color .25s ease, background .25s ease, opacity .35s ease;
}

.menu-item[data-page="favoritos"],
.menu-item[data-page="sobre"]{
    border-bottom:0;
}

.menu-item svg{
    width:27px;
    height:27px;
    flex:0 0 27px;
    display:block;
    stroke:var(--gold);
    fill:none;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .25s ease, filter .25s ease;
}

.menu-item svg text{
    fill:var(--gold);
    stroke:none;
    font-family:Arial, Helvetica, sans-serif;
    font-size:5.5px;
    font-weight:700;
    letter-spacing:.3px;
}

.menu-item span{
    font-size:16px;
    font-weight:400;
    line-height:1.2;
    letter-spacing:0;
    white-space:nowrap;
}

.menu-item::before{
    content:"";
    position:absolute;
    left:-18px;
    top:12px;
    bottom:12px;
    width:5px;
    border-radius:0 2px 2px 0;
    background:var(--gold);
    box-shadow:0 0 16px rgba(212,175,55,.75);
    opacity:0;
    transition:opacity .25s ease;
}

.menu-item:active,
.menu-item.active{
    color:var(--gold);
    background:linear-gradient(90deg,rgba(212,175,55,.09),transparent 78%);
    transform:none;
}

.menu-item.active::before{
    opacity:1;
}

.menu-item:active svg,
.menu-item.active svg{
    transform:scale(1.04);
    filter:drop-shadow(0 0 6px rgba(212,175,55,.55));
}

.menu-divider{
    position:relative;
    width:100%;
    height:28px;
    margin:0;
    background:linear-gradient(90deg,transparent,rgba(212,175,55,.60),transparent) center/100% 1px no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-divider span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    background:#080808;
    color:var(--gold);
    font-size:15px;
    line-height:1;
    text-shadow:0 0 8px rgba(212,175,55,.45);
}

.menu-item.menu-enter{
    opacity:0;
    transform:translateX(-12px);
}

.menu-panel.active .menu-item.menu-enter{
    opacity:1;
    transform:translateX(0);
}

.menu-panel.active .menu-item:nth-child(3){transition-delay:.03s}
.menu-panel.active .menu-item:nth-child(4){transition-delay:.06s}
.menu-panel.active .menu-item:nth-child(5){transition-delay:.09s}
.menu-panel.active .menu-item:nth-child(6){transition-delay:.12s}
.menu-panel.active .menu-item:nth-child(7){transition-delay:.15s}
.menu-panel.active .menu-item:nth-child(9){transition-delay:.18s}
.menu-panel.active .menu-item:nth-child(10){transition-delay:.21s}
.menu-panel.active .menu-item:nth-child(11){transition-delay:.24s}

/* =====================
       OVERLAY
===================== */


.overlay{


    position:fixed;



    inset:0;



    background:rgba(0,0,0,.75);



    z-index:15;



    display:none;



}






.overlay.active{


    display:block;



}








/* =====================

===================== */


.content{


    height:calc(100vh - 225px);



    display:flex;



    justify-content:center;



    align-items:center;



    color:#555;



}
</style>

</head>

<script>


// LOADING


setTimeout(()=>{


document.getElementById("loader").style.display="none";


document.getElementById("home").style.display="block";


},3000);







const menuPanel =
document.getElementById("menuPanel");


const cartPanel =
document.getElementById("cartPanel");


const overlay =
document.getElementById("overlay");







function openMenu(){


cartPanel.classList.remove("active");


menuPanel.classList.add("active");


overlay.classList.add("active");


}








function openCart(){


menuPanel.classList.remove("active");


cartPanel.classList.add("active");


overlay.classList.add("active");


}







function closePanels(){


menuPanel.classList.remove("active");


cartPanel.classList.remove("active");


overlay.classList.remove("active");


}







const items =
document.querySelectorAll(".menu-item");


items.forEach(item=>{

item.addEventListener("click",()=>{

items.forEach(i=>i.classList.remove("active"));

item.classList.add("active");

/* Prepara a prÃÂ³xima lÃÂ¢mina sem criar as pÃÂ¡ginas ainda. */
const page = item.dataset.page;
document.body.dataset.pmxPage = page;

window.dispatchEvent(
new CustomEvent("pmx:navigate",{detail:{page}})
);

/* Mostra o toque antes de fechar o menu automaticamente. */
setTimeout(()=>{
    item.classList.remove("active");
    closePanels();
},120);

});

});


</script>
